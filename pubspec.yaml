dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.26.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/phytia_core.json.gz
    - assets/data/phytia_details.json.gz
